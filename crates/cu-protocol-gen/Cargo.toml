[package]
name = "cu-protocol-gen"
version = "0.2.0-alpha.1"
edition = "2021"
description = "Assembles the Computer Use protocol v3 JSON Schema from the Rust wire types (single source of truth)"
publish = false

[dependencies]
cu-core = { path = "../cu-core" }
cu-trace = { path = "../cu-trace" }
cu-runtime = { path = "../cu-runtime" }
schemars = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }

[dev-dependencies]
jsonschema = { workspace = true }
chrono = { workspace = true }
