$schema: https://github.com/taotao135791-bit/oc-computer-use/blob/main/benchmarks/schema/task.schema.json
id: calc-01-simple-addition
name: 简单加法
category: calculator
difficulty: easy
environment:
  apps_required: [Calculator]
  scratch_required: false
instruction: |
  打开"计算器"应用，输入 12 + 34，按等号。把结果（应为 46）完整显示出来
  （保持计算器显示结果的状态，不要清除）。
success_criteria:
  - type: app_running
    app: Calculator
  - type: human_review
    reason: 计算器显示结果 46（通过 trace 截图确认）
max_steps: 30
max_duration_seconds: 600
risk_level: low
notes: 计算器结果无法从外部读取，需要人工复核 trace 截图。
