# Gitleaks configuration for oc-computer-use.
#
# The repo's real secrets are *generated at runtime* (256-bit base64url
# capability tokens) and never committed, so this config's job is:
#   1. catch any 256-bit token-shaped string that does slip into the tree;
#   2. allowlist the clearly-fake tokens tests and fixtures use.
#
# Run locally:  gitleaks detect --source . --no-banner
# CI:           .github/workflows/ci.yml → gitleaks/gitleaks-action

title = "oc-computer-use secret scan"

[extend]
useDefault = true

# Capability tokens are exactly 32 random bytes base64url-encoded without
# padding: 43 characters from [A-Za-z0-9_-]. Control, observation, and admin
# tokens all share this shape.
#
# The rule anchors on the field name — a real token only ever appears as the
# value of control_token / observation_token / admin_token (snake_case on the
# wire, camelCase in SDK configs). Anchoring is what makes this scan
# reliable: a bare 43-char pattern would otherwise match random-looking
# non-secrets (Cargo.lock checksums, base64 fixtures), and entropy cannot
# separate those from real tokens — a 43-char CSPRNG sample's realized
# entropy (≈4.5–5.4) overlaps theirs. The field context is unambiguous, so a
# modest entropy floor (3.0) only filters obvious placeholders.
[[rules]]
id = "cu-capability-token"
description = "oc-computer-use 256-bit capability token (control / observation / admin)"
regex = '''["']?(?:control_token|observation_token|admin_token|controlToken|observationToken|adminToken)["']?\s*[:=]\s*["']([A-Za-z0-9_-]{43})["']?'''
secretGroup = 1
entropy = 3.0
tags = ["computer-use", "capability-token"]

[allowlist]
# Test fixtures and fake credentials — deliberately-not-secret strings the
# test suites and examples use. They never match the real token shape, but
# keeping them here documents that they are *intended* fakes.
regexes = [
  # All `fake-...token...` test values across crates and packages.
  '''fake-[a-z-]+token[a-z-]*''',
  # "wrong-token", "not-a-token", etc.
  '''\b(?:wrong|bad|not-a|no|missing)-token\b''',
  # SHA-256 digests (Cargo.lock checksums, SecretTokenHash::to_hex output in
  # tests) are hashes, not secrets.
  '''[0-9a-f]{64}''',
  # Redaction markers must never be flagged.
  '''<redacted>|\[REDACTED\]''',
]
# Note: no path-based allowlist — the custom rule must keep scanning every
# file, including generated artifacts (a real token has no business in any of
# them).
