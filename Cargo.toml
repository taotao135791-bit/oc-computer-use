[workspace]
resolver = "2"
members = [
    "crates/cu-core",
    "crates/cu-driver",
    "crates/cu-driver-macos",
    "crates/cu-runtime",
    "crates/cu-policy",
    "crates/cu-trace",
    "crates/cu-daemon",
    "crates/cu-cli",
    "crates/cu-protocol-gen",
]

[workspace.package]
version = "0.2.0-alpha.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/taotao135791-bit/oc-computer-use"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
anyhow = "1"
async-trait = "0.1"
futures = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }
rand = "0.8"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
dirs = "5"
libc = "0.2"
tempfile = "3"
sha2 = "0.10"
hex = "0.4"
tokio-util = "0.7"
# Protocol single-source-of-truth: wire types derive JSON Schemas (schemars)
# that a generator emits and adapters consume; the schema is validated in CI.
schemars = { version = "0.8", features = ["chrono"] }
jsonschema = "0.26"

[profile.release]
lto = "thin"
opt-level = 2
